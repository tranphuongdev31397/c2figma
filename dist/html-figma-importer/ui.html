<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML → Figma Visual Importer</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #171717; background: #f7f8f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(720px, 100%); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .mark { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: white; background: #16993b; font-weight: 800; }
    h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
    .sub { margin: 5px 0 0; color: #737373; font-size: 13px; }
    .card { background: white; border: 1px solid #e5e5e5; border-radius: 14px; padding: 22px; box-shadow: 0 8px 24px #0000000b; }
    .drop { border: 1.5px dashed #b9c6b7; border-radius: 12px; min-height: 190px; display: grid; place-items: center; text-align: center; padding: 26px; background: #fbfdf9; cursor: pointer; }
    .drop.drag { background: #ebf3e0; border-color: #16993b; }
    .drop strong { display: block; margin-bottom: 8px; font-size: 15px; }
    .drop span { color: #737373; font-size: 13px; }
    input[type=file] { display: none; }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 20px; }
    .primary-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
    button, .button { border: 1px solid #e5e5e5; background: white; color: #171717; border-radius: 8px; height: 38px; padding: 0 14px; font: 600 13px inherit; cursor: pointer; }
    a.button { display: inline-flex; align-items: center; text-decoration: none; }
    a.button.install { border-color: #16993b; background: #16993b; color: white; }
    a.button.fallback { color: #16993b; }
    .guide-link { color: #737373; font-size: 12px; font-weight: 600; text-underline-offset: 3px; }
    .guide-link:hover { color: #16993b; }
    .guide-link span { margin-left: 4px; color: #16993b; }
    button.primary { border-color: #16993b; background: #16993b; color: white; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #summary { display: none; margin-top: 18px; padding-top: 18px; border-top: 1px solid #e5e5e5; }
    .summary-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .summary-head strong { font-size: 15px; }
    .summary-head span { color: #737373; font-size: 12px; }
    .page-name { display: grid; gap: 6px; margin-top: 14px; }
    .page-name label { color: #737373; font-size: 12px; font-weight: 600; }
    .page-name input { width: 100%; height: 38px; border: 1px solid #dcdcdc; border-radius: 8px; padding: 0 11px; color: #171717; font: 500 13px inherit; }
    .page-name input:focus { outline: 2px solid #c8e6cc; border-color: #16993b; }
    .state-option { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; color: #525252; font-size: 12px; line-height: 1.4; }
    .state-option input { margin: 2px 0 0; accent-color: #16993b; }
    .state-option small { display: block; color: #8a8a8a; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip { border: 1px solid #dbe8d7; background: #ebf3e0; color: #16993b; border-radius: 999px; padding: 5px 9px; font-size: 12px; }
    .note { color: #737373; font-size: 12px; line-height: 1.5; margin: 18px 0 0; }
    #status { min-height: 18px; margin-top: 12px; color: #16993b; font-size: 12px; }
    code { font-size: 12px; background: #f5f5f5; border-radius: 5px; padding: 2px 5px; }
    @media (max-width: 620px) {
      .actions { align-items: stretch; flex-direction: column; }
      .primary-actions { justify-content: stretch; flex-wrap: wrap; }
      .primary-actions .button, .primary-actions button { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark">S</div><div><h1>HTML → Figma</h1><p class="sub">Chọn file standalone để tạo plugin Figma visual editable</p></div></div>
    <section class="card">
      <label class="drop" id="drop" for="file">
        <div><strong>Kéo thả file HTML vào đây</strong><span>hoặc bấm để chọn file từ máy</span></div>
      </label>
      <input id="file" type="file" accept=".html,.htm,text/html">
      <label class="state-option"><input id="interactive" type="checkbox"><span>Khám phá trạng thái tương tác<small>Thử các nút, row, tab và modal phổ biến (tối đa 8 state).</small></span></label>
      <div id="summary">
        <div class="summary-head"><strong id="title">—</strong><span id="stats">—</span></div>
        <div class="page-name" id="page-name-field" hidden><label for="page-name">Tên page Figma</label><input id="page-name" type="text" maxlength="120" autocomplete="off"></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="actions">
        <a class="guide-link" href="/guide">Hướng dẫn sử dụng <span>↗</span></a>
        <div class="primary-actions">
          <a class="button install" data-install href="/downloads/html-figma-importer.zip" download>Cài plugin một lần</a>
          <button id="download" class="fallback" disabled>Tải theo HTML (.zip)</button>
        </div>
      </div>
      <div id="status"></div>
      <p class="note" id="note">Cài plugin Figma một lần để các lần sau chọn HTML và render trực tiếp trong Figma Desktop.</p>
    </section>
  </main>
  <script>
(function (global) {
  const DEFAULTS = { width: 1440, height: 900, timeout: 15000 };

  function captureSceneGraph(html, options = {}) {
    const settings = { ...DEFAULTS, ...options };
    return new Promise((resolve, reject) => {
      const iframe = document.createElement('iframe');
      const token = 'scene-' + Date.now() + '-' + Math.random().toString(36).slice(2);
      let timer;
      let settled = false;

      const finish = (handler, value) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        window.removeEventListener('message', onMessage);
        iframe.remove();
        handler(value);
      };

      const onMessage = event => {
        if (event.source !== iframe.contentWindow || !event.data || event.data.token !== token) return;
        if (event.data.type === 'html-figma-scene') finish(resolve, event.data.scene);
        if (event.data.type === 'html-figma-scene-error') finish(reject, new Error(event.data.message));
      };

      window.addEventListener('message', onMessage);
      // ponytail: Claude bundles need same-origin to hydrate their internal blob resources;
      // keep the broader sandbox for ordinary HTML instead of weakening every upload.
      const needsBundleCompatibility = /__bundler\/(?:manifest|template|page_order)/.test(html);
      iframe.setAttribute('sandbox', needsBundleCompatibility ? 'allow-scripts allow-same-origin' : 'allow-scripts');
      iframe.setAttribute('aria-hidden', 'true');
      iframe.style.cssText = [
        'position:fixed', 'left:-10000px', 'top:0', 'width:' + settings.width + 'px',
        'height:' + settings.height + 'px', 'border:0', 'opacity:0', 'pointer-events:none'
      ].join(';');
      document.body.appendChild(iframe);

      const minimumDelay = needsBundleCompatibility ? 3000 : 600;
      const script = '(' + captureWhenStable.toString() + ')((' + serializeScene.toString() + '),' + JSON.stringify(token) + ',' + settings.width + ',' + settings.height + ',' + minimumDelay + ');';
      const probe = '<script>' + script + '<\/script>';
      iframe.srcdoc = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, probe + '</body>') : html + probe;
      timer = setTimeout(() => finish(reject, new Error('Không thể dựng layout HTML trong thời gian cho phép.')), settings.timeout);
    });
  }

  function captureStateGraph(html, options = {}) {
    const settings = { ...DEFAULTS, maxDepth: 2, maxStates: 8, maxActions: 8, ...options };
    const queue = [{ path: [], labels: [] }];
    const queued = new Set(['']);
    const fingerprints = new Set();
    const states = [];
    const visit = async () => {
      while (queue.length && states.length < settings.maxStates) {
        const task = queue.shift();
        let result;
        try { result = await captureStatePath(html, task.path, settings); }
        catch (error) { if (!states.length) throw error; continue; }
        const fingerprint = JSON.stringify(result.scene.nodes.map(node => [node.kind, Math.round(node.x), Math.round(node.y), Math.round(node.width), Math.round(node.height), node.text, node.name, node.fill, node.stroke, node.opacity]));
        if (fingerprints.has(fingerprint)) continue;
        fingerprints.add(fingerprint);
        states.push({ id: 'state-' + String(states.length + 1).padStart(2, '0'), label: task.labels.join(' → ') || 'Default', actionPath: task.path, scene: result.scene });
        if (task.path.length >= settings.maxDepth) continue;
        result.actions.slice(0, settings.maxActions).forEach(action => {
          const path = [...task.path, action.index], key = path.join('.');
          if (queued.has(key)) return;
          queued.add(key);
          queue.push({ path, labels: [...task.labels, action.label] });
        });
      }
      return { version: 2, viewport: { width: settings.width, height: settings.height }, states };
    };
    return visit();
  }

  function captureStatePath(html, path, settings) {
    return new Promise((resolve, reject) => {
      const iframe = document.createElement('iframe');
      const token = 'state-' + Date.now() + '-' + Math.random().toString(36).slice(2);
      let timer;
      let settled = false;
      const finish = (handler, value) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        window.removeEventListener('message', onMessage);
        iframe.remove();
        handler(value);
      };
      const onMessage = event => {
        if (event.source !== iframe.contentWindow || !event.data || event.data.token !== token) return;
        if (event.data.type === 'html-figma-state') finish(resolve, event.data);
        if (event.data.type === 'html-figma-state-error') finish(reject, new Error(event.data.message));
      };
      window.addEventListener('message', onMessage);
      const needsBundleCompatibility = /__bundler\/(?:manifest|template|page_order)/.test(html);
      iframe.setAttribute('sandbox', needsBundleCompatibility ? 'allow-scripts allow-same-origin' : 'allow-scripts');
      iframe.setAttribute('aria-hidden', 'true');
      iframe.style.cssText = ['position:fixed', 'left:-10000px', 'top:0', 'width:' + settings.width + 'px', 'height:' + settings.height + 'px', 'border:0', 'opacity:0', 'pointer-events:none'].join(';');
      document.body.appendChild(iframe);
      const minimumDelay = needsBundleCompatibility ? 3000 : 600;
      const script = '(' + captureStateWhenStable.toString() + ')((' + serializeScene.toString() + '),' + JSON.stringify(token) + ',' + settings.width + ',' + settings.height + ',' + minimumDelay + ',' + JSON.stringify(path) + ',' + settings.maxActions + ');';
      const probe = '<script>' + script + '<\/script>';
      iframe.srcdoc = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, probe + '</body>') : html + probe;
      timer = setTimeout(() => finish(reject, new Error('Không thể khám phá state HTML trong thời gian cho phép.')), settings.timeout);
    });
  }

  function captureStateWhenStable(serialize, token, width, height, minimumDelay, path, maxActions) {
    const waitForStable = () => new Promise(resolve => {
      const started = Date.now();
      let previous = '', stableTicks = 0;
      const check = () => {
        const signature = [document.readyState, document.querySelectorAll('*').length, (document.body?.innerText || '').replace(/\s+/g, ' ').slice(0, 1000)].join('|');
        if (signature === previous) stableTicks += 1;
        else { previous = signature; stableTicks = 0; }
        if (Date.now() - started >= minimumDelay && stableTicks >= 2) return resolve();
        if (Date.now() - started >= 10000) return resolve();
        setTimeout(check, 250);
      };
      setTimeout(check, 100);
    });
    const labelFor = element => (element.getAttribute('aria-label') || element.getAttribute('title') || element.getAttribute('data-action') || element.textContent || element.tagName).replace(/\s+/g, ' ').trim().slice(0, 60) || element.tagName;
    const candidates = () => [...document.querySelectorAll('*')].filter(element => {
      if (element.id.startsWith('__bundler_') || element.closest('[id^="__bundler_"]')) return false;
      if (element.disabled || element.getAttribute('aria-disabled') === 'true') return false;
      const rect = element.getBoundingClientRect(), style = getComputedStyle(element);
      if (style.display === 'none' || style.visibility === 'hidden' || rect.width <= 0 || rect.height <= 0) return false;
      const tag = element.tagName.toLowerCase(), href = element.getAttribute('href');
      if (tag === 'a' && href && !href.startsWith('#') && !href.startsWith('javascript:')) return false;
      return ['button', 'summary', 'select', 'textarea'].includes(tag) || tag === 'a' || element.matches('[role="button"],[aria-haspopup],[aria-expanded],[onclick],[data-action],[data-state],[role="row"]') || style.cursor === 'pointer';
    }).slice(0, maxActions);
    const run = async () => {
      await waitForStable();
      for (const index of path) {
        const target = candidates()[index];
        if (!target) throw new Error('Không tìm thấy action ở path ' + path.join('.'));
        target.click();
        await waitForStable();
      }
      const actions = candidates().map((element, index) => ({ index, label: labelFor(element), tag: element.tagName.toLowerCase() }));
      serialize(token, width, height, scene => parent.postMessage({ type: 'html-figma-state', token, path, scene, actions }, '*'));
    };
    run().catch(error => parent.postMessage({ type: 'html-figma-state-error', token, message: error.message }, '*'));
  }

  function captureWhenStable(serialize, token, width, height, minimumDelay) {
    const started = Date.now();
    let previous = '';
    let stableTicks = 0;
    const check = () => {
      const body = document.body;
      const signature = [
        document.readyState,
        document.querySelectorAll('*').length,
        (body ? body.innerText : '').replace(/\s+/g, ' ').slice(0, 1000)
      ].join('|');
      if (signature === previous) stableTicks += 1;
      else { previous = signature; stableTicks = 0; }
      if (Date.now() - started >= minimumDelay && stableTicks >= 3) return serialize(token, width, height);
      if (Date.now() - started >= 10000) return serialize(token, width, height);
      setTimeout(check, 250);
    };
    setTimeout(check, 100);
  }

  function serializeScene(token, width, height, emit) {
    try {
      const ignored = new Set(['SCRIPT', 'STYLE', 'META', 'LINK', 'TITLE', 'NOSCRIPT', 'TEMPLATE']);
      const parseColor = value => {
        if (!value || value === 'transparent') return null;
        const clamp = channel => Math.max(0, Math.min(1, channel));
        const alpha = value => value === undefined ? 1 : clamp(Number(value.replace('%', '')) / (value.includes('%') ? 100 : 1));
        const rgb = (r, g, b, a = 1) => ({r:clamp(Number(r) / 255), g:clamp(Number(g) / 255), b:clamp(Number(b) / 255), a});
        const hex = value.match(/^#([0-9a-f]{3,8})$/i);
        if (hex) {
          const raw = hex[1].length <= 4 ? hex[1].split('').map(part => part + part).join('') : hex[1];
          return rgb(parseInt(raw.slice(0,2),16), parseInt(raw.slice(2,4),16), parseInt(raw.slice(4,6),16), raw.length === 8 ? parseInt(raw.slice(6,8),16) / 255 : 1);
        }
        const oklch = value.match(/^oklch\(\s*([\d.]+)(%)?\s+([\d.]+)(%)?\s+([\d.+-]+)(deg|rad|grad|turn)?(?:\s*\/\s*([\d.]+%?))?\s*\)$/i);
        if (oklch) {
          const L = Number(oklch[1]) / (oklch[2] ? 100 : 1), C = Number(oklch[3]) / (oklch[4] ? 100 : 1);
          const unit = oklch[6] || 'deg', angle = Number(oklch[5]) * (unit === 'rad' ? 1 : unit === 'grad' ? Math.PI / 200 : unit === 'turn' ? Math.PI * 2 : Math.PI / 180);
          const a = C * Math.cos(angle), b = C * Math.sin(angle), l = (L + 0.3963377774*a + 0.2158037573*b) ** 3, m = (L - 0.1055613458*a - 0.0638541728*b) ** 3, s = (L - 0.0894841775*a - 1.291485548*b) ** 3;
          const convert = channel => channel <= 0.0031308 ? 12.92 * channel : 1.055 * Math.pow(channel, 1 / 2.4) - 0.055;
          return {r:clamp(convert(4.0767416621*l - 3.3077115913*m + 0.2309699292*s)), g:clamp(convert(-1.2684380046*l + 2.6097574011*m - 0.3413193965*s)), b:clamp(convert(-0.0041960863*l - 0.7034186147*m + 1.707614701*s)), a:alpha(oklch[7])};
        }
        const match = value.match(/rgba?\(([^)]+)\)/i);
        if (!match) return null;
        const parts = match[1].replace('/', ',').split(',').map(part => part.trim());
        const channel = part => Number(part.replace('%', '')) * (part.includes('%') ? 2.55 : 1);
        return rgb(channel(parts[0]), channel(parts[1]), channel(parts[2]), alpha(parts[3]));
      };
      const number = value => Number.parseFloat(value) || 0;
      const colorHex = value => {
        const color = parseColor(value) || { r: 0, g: 0, b: 0 };
        return '#' + [color.r, color.g, color.b].map(channel => Math.round(channel * 255).toString(16).padStart(2, '0')).join('');
      };
      const visible = (element, style, rect) => style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) !== 0 && rect.width > 0 && rect.height > 0 && rect.right >= 0 && rect.bottom >= 0 && rect.left <= width && rect.top <= height;
      const technical = element => element.id.startsWith('__bundler_') || element.closest('[id^="__bundler_"]');
      const payload = value => /(?:data:)?(?:text\/html|application\/json);base64,/i.test(value) || /^[A-Za-z0-9+/]{240,}={0,2}$/.test(value);
      const nameIndex = new Map();
      const semanticTags = { html: 'Document', body: 'Page', button: 'Button', input: 'Input', textarea: 'Textarea', table: 'Table', thead: 'Table header', tbody: 'Table body', tr: 'Row', th: 'Header cell', td: 'Cell', svg: 'Icon', img: 'Image', form: 'Form', ul: 'List', ol: 'List', li: 'List item' };
      const nameForElement = element => {
        const tag = element.tagName.toLowerCase();
        const className = (element.getAttribute('class') || '').split(/\s+/).find(Boolean);
        const label = element.getAttribute('aria-label') || element.getAttribute('data-testid') || element.getAttribute('data-name') || element.id || className;
        const base = label || semanticTags[tag] || 'Frame';
        const index = (nameIndex.get(base) || 0) + 1;
        nameIndex.set(base, index);
        return base + ' · ' + String(index).padStart(2, '0');
      };
      const nodes = [];
      const ids = new Map();
      const elements = [...document.querySelectorAll('*')].filter(element => !ignored.has(element.tagName));

      for (const element of elements) {
        const isSvg = element.tagName.toLowerCase() === 'svg';
        if (!isSvg && element.closest('svg')) continue;
        const style = getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        if (!visible(element, style, rect) || technical(element) || nodes.length >= 2000) continue;
        const id = 'n' + nodes.length;
        ids.set(element, id);
        let parent = element.parentElement;
        while (parent && !ids.has(parent)) parent = parent.parentElement;
        const border = {
          top: { width: number(style.borderTopWidth), color: parseColor(style.borderTopColor) },
          right: { width: number(style.borderRightWidth), color: parseColor(style.borderRightColor) },
          bottom: { width: number(style.borderBottomWidth), color: parseColor(style.borderBottomColor) },
          left: { width: number(style.borderLeftWidth), color: parseColor(style.borderLeftColor) }
        };
        const stroke = [border.top, border.right, border.bottom, border.left].find(side => side.width) || { width: 0, color: null };
        const radius = Math.max(number(style.borderTopLeftRadius), number(style.borderTopRightRadius), number(style.borderBottomRightRadius), number(style.borderBottomLeftRadius));
        nodes.push({
          id,
          parentId: parent ? ids.get(parent) : null,
          kind: isSvg ? 'svg' : 'box',
          name: nameForElement(element),
          x: rect.left,
          y: rect.top,
          width: rect.width,
          height: rect.height,
          fill: parseColor(style.backgroundColor),
          stroke: stroke.color,
          strokeWidth: stroke.width,
          borders: border,
          radius,
          position: style.position,
          overflow: style.overflow,
          opacity: Number(style.opacity) || 1,
          text: '',
          fontSize: number(style.fontSize),
          fontWeight: Number.parseInt(style.fontWeight, 10) || 400,
          color: parseColor(style.color),
          svg: isSvg ? element.outerHTML.replace(/currentColor/gi, colorHex(style.color)) : null
        });

        for (const child of element.childNodes) {
          if (child.nodeType !== 3 || !child.data.trim() || nodes.length >= 2000) continue;
          const range = document.createRange();
          range.selectNodeContents(child);
          const text = child.data.replace(/\s+/g, ' ').trim();
          if (payload(text)) continue;
          for (const textRect of [...range.getClientRects()]) {
            if (!text || textRect.width <= 0 || textRect.height <= 0) continue;
            nodes.push({
              id: 'n' + nodes.length,
              parentId: id,
              kind: 'text',
              name: 'Text / ' + text.slice(0, 40),
              x: textRect.left,
              y: textRect.top,
              width: textRect.width,
              height: textRect.height,
              fill: null,
              stroke: null,
              strokeWidth: 0,
              radius: 0,
              opacity: Number(style.opacity) || 1,
              text,
              fontSize: number(style.fontSize),
              fontWeight: Number.parseInt(style.fontWeight, 10) || 400,
              color: parseColor(style.color)
            });
          }
        }

        if ((element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') && (element.value || element.placeholder)) {
          const text = element.value || element.placeholder;
          const textStyle = element.value ? style : getComputedStyle(element, '::placeholder');
          const lineHeight = number(style.lineHeight) || number(style.fontSize);
          nodes.push({
            id: 'n' + nodes.length,
            parentId: id,
            kind: 'text',
            name: 'Text / ' + text.slice(0, 40),
            x: rect.left + number(style.borderLeftWidth) + number(style.paddingLeft),
            y: rect.top + (rect.height - lineHeight) / 2,
            width: Math.max(1, rect.width - number(style.borderLeftWidth) - number(style.borderRightWidth) - number(style.paddingLeft) - number(style.paddingRight)),
            height: lineHeight,
            fill: null,
            stroke: null,
            strokeWidth: 0,
            radius: 0,
            opacity: Number(style.opacity) || 1,
            text,
            fontSize: number(style.fontSize),
            fontWeight: Number.parseInt(style.fontWeight, 10) || 400,
            color: parseColor(textStyle.color || style.color)
          });
        }
      }

      const scene = { version: 1, viewport: { width, height }, nodes };
      if (emit) return emit(scene);
      parent.postMessage({ type: 'html-figma-scene', token, scene }, '*');
    } catch (error) {
      parent.postMessage({ type: emit ? 'html-figma-state-error' : 'html-figma-scene-error', token, message: error.message }, '*');
    }
  }

  global.captureSceneGraph = captureSceneGraph;
  global.captureStateGraph = captureStateGraph;
})(window);

</script>
  <script>
(function (global) {
  global.pluginCode = function pluginCode(scene, pageName, title, graph) {
    const data = JSON.stringify(scene || null).replace(/</g, '\\u003c');
    const graphData = JSON.stringify(graph || null).replace(/</g, '\\u003c');
    const requestedPageName = JSON.stringify(pageName || title || 'Imported HTML').replace(/</g, '\\u003c');
    const contentTitle = JSON.stringify(title || 'Imported HTML').replace(/</g, '\\u003c');
