<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML → Figma Visual Importer</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #171717; background: #f7f8f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(720px, 100%); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .mark { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: white; background: #16993b; font-weight: 800; }
    h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
    .sub { margin: 5px 0 0; color: #737373; font-size: 13px; }
    .card { background: white; border: 1px solid #e5e5e5; border-radius: 14px; padding: 22px; box-shadow: 0 8px 24px #0000000b; }
    .drop { border: 1.5px dashed #b9c6b7; border-radius: 12px; min-height: 190px; display: grid; place-items: center; text-align: center; padding: 26px; background: #fbfdf9; cursor: pointer; }
    .drop.drag { background: #ebf3e0; border-color: #16993b; }
    .drop strong { display: block; margin-bottom: 8px; font-size: 15px; }
    .drop span { color: #737373; font-size: 13px; }
    input[type=file] { display: none; }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 20px; }
    .primary-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
    button, .button { border: 1px solid #e5e5e5; background: white; color: #171717; border-radius: 8px; height: 38px; padding: 0 14px; font: 600 13px inherit; cursor: pointer; }
    a.button { display: inline-flex; align-items: center; text-decoration: none; }
    .install { border-color: #16993b; background: #16993b; color: white; }
    .install:disabled { opacity: .55; }
    .fallback { color: #16993b; }
    .guide-link { color: #737373; font-size: 12px; font-weight: 600; text-underline-offset: 3px; }
    .guide-link:hover { color: #16993b; }
    .guide-link span { margin-left: 4px; color: #16993b; }
    button.primary { border-color: #16993b; background: #16993b; color: white; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #summary { display: none; margin-top: 18px; padding-top: 18px; border-top: 1px solid #e5e5e5; }
    .summary-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .summary-head strong { font-size: 15px; }
    .summary-head span { color: #737373; font-size: 12px; }
    .page-name { display: grid; gap: 6px; margin-top: 14px; }
    .page-name label { color: #737373; font-size: 12px; font-weight: 600; }
    .page-name input { width: 100%; height: 38px; border: 1px solid #dcdcdc; border-radius: 8px; padding: 0 11px; color: #171717; font: 500 13px inherit; }
    .page-name input:focus { outline: 2px solid #c8e6cc; border-color: #16993b; }
    .interactive { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: #444; font-size: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip { border: 1px solid #dbe8d7; background: #ebf3e0; color: #16993b; border-radius: 999px; padding: 5px 9px; font-size: 12px; }
    .note { color: #737373; font-size: 12px; line-height: 1.5; margin: 18px 0 0; }
    #status { min-height: 18px; margin-top: 12px; color: #16993b; font-size: 12px; }
    code { font-size: 12px; background: #f5f5f5; border-radius: 5px; padding: 2px 5px; }
    @media (max-width: 620px) {
      .actions { align-items: stretch; flex-direction: column; }
      .primary-actions { justify-content: stretch; flex-wrap: wrap; }
      .primary-actions .button, .primary-actions button { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark">S</div><div><h1>HTML → Figma</h1><p class="sub">Chọn file standalone để tạo plugin Figma visual editable</p></div></div>
    <section class="card">
      <label class="drop" id="drop" for="file">
        <div><strong>Kéo thả file HTML vào đây</strong><span>hoặc bấm để chọn file từ máy</span></div>
      </label>
      <input id="file" type="file" accept=".html,.htm,text/html">
      <label class="interactive"><input id="interactive" type="checkbox" checked> Khám phá các state tương tác <span id="state-limit"></span></label>
      <div id="summary">
        <div class="summary-head"><strong id="title">—</strong><span id="stats">—</span></div>
        <div class="page-name" id="page-name-field" hidden><label for="page-name">Tên page Figma</label><input id="page-name" type="text" maxlength="120" autocomplete="off"></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="actions">
        <a class="guide-link" href="/guide">Hướng dẫn sử dụng <span>↗</span></a>
        <div class="primary-actions">
          <a class="button install" data-install href="/downloads/html-figma-importer.zip" download>Cài plugin một lần</a>
          <button id="download" class="fallback" disabled>Tải theo HTML (.zip)</button>
        </div>
      </div>
      <div id="status"></div>
      <p class="note" id="note">Cài plugin Figma một lần để các lần sau chọn HTML và render trực tiếp trong Figma Desktop.</p>
    </section>
  </main>
  <script src="/scene-capture.js"></script>
  <script src="/plugin-code.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let selected = null;
    const inFigma = window.parent !== window;
    const clean = value => { const el = document.createElement('textarea'); el.innerHTML = value; return el.value.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); };
    const unique = values => [...new Set(values.filter(Boolean))];
    function extract(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const source = html.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi, '');
      const tokens = {};
      for (const m of html.matchAll(/--([\w-]+)\s*:\s*([^;{}\n]+)/g)) tokens[m[1]] = m[2].trim();
      const headings = unique([...doc.querySelectorAll('h1,h2,h3')].map(n => clean(n.innerHTML)));
      const labels = unique([
        ...[...doc.querySelectorAll('button,label,summary')].map(n => clean(n.innerHTML)),
        ...[...doc.querySelectorAll('[class*="badge"],[class*="status"],[class*="chip"]')].map(n => clean(n.innerHTML))
      ]);
      return { title: clean(doc.title || 'Untitled'), tokens, headings, labels };
    }
    const crcTable = (() => { const table=[]; for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;table[n]=c>>>0;}return table; })();
    const crc32 = bytes => { let crc=0xffffffff; for(const b of bytes)crc=crcTable[(crc^b)&255]^(crc>>>8); return (crc^0xffffffff)>>>0; };
    const u16 = (a,n) => { a.push(n&255,(n>>>8)&255); };
    const u32 = (a,n) => { a.push(n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255); };
    const concat = parts => { const out=new Uint8Array(parts.reduce((n,p)=>n+p.length,0)); let at=0; for(const p of parts){out.set(p,at);at+=p.length;}return out; };
    function zip(files) {
      const enc=new TextEncoder(), local=[], central=[]; let offset=0;
      for(const file of files){const name=enc.encode(file.name),data=enc.encode(file.content),crc=crc32(data);const h=[];u32(h,0x04034b50);u16(h,20);u16(h,0);u16(h,0);u16(h,0);u16(h,0);u32(h,crc);u32(h,data.length);u32(h,data.length);u16(h,name.length);u16(h,0);local.push(Uint8Array.from(h),name,data);const c=[];u32(c,0x02014b50);u16(c,20);u16(c,20);u16(c,0);u16(c,0);u16(c,0);u16(c,0);u32(c,crc);u32(c,data.length);u32(c,data.length);u16(c,name.length);u16(c,0);u16(c,0);u16(c,0);u16(c,0);u32(c,0);u32(c,offset);central.push(Uint8Array.from(c),name);offset+=30+name.length+data.length;}
      const cd=concat(central), end=[];u32(end,0x06054b50);u16(end,0);u16(end,0);u16(end,files.length);u16(end,files.length);u32(end,cd.length);u32(end,offset);u16(end,0);return concat([...local,cd,Uint8Array.from(end)]);
    }
    const fileBaseName = name => String(name || '').replace(/\.[^.]+$/, '').trim() || 'Imported HTML';
    function download() {
      const spec=selected.spec, graph=selected.graph;
      const files=[{name:'manifest.json',content:JSON.stringify({name:'HTML Visual Import',api:'1.0.0',main:'code.js',networkAccess:{allowedDomains:['none']},editorType:['figma']},null,2)},{name:'code.js',content:pluginCode(selected.scene, selected.pageName, spec.title)+(graph ? '\\nconst STATE_GRAPH = '+JSON.stringify(graph).replace(/</g,'\\\\u003c')+';\\n' : '')}];
      if (selected.scene) files.push({name:'scene.json',content:JSON.stringify(selected.scene,null,2)});
      if (graph) files.push({name:'states.json',content:JSON.stringify(graph.states,null,2)});
      files.push({name:'spec.json',content:JSON.stringify(spec,null,2)},{name:'README.md',content:'# '+selected.pageName+'\\n\\nGenerated from standalone HTML. Import manifest.json in Figma Desktop.\\n'});
      const blob=new Blob([zip(files)],{type:'application/zip'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(selected.pageName||'html-design').replace(/[^\\p{L}\\p{N}]+/gu,'-').replace(/^-|-$/g,'').toLowerCase()+'-figma-plugin.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='Đã tạo plugin ZIP. Mở file zip và import manifest.json vào Figma.';
    }
    const postToFigma = message => parent.postMessage({ pluginMessage: message }, '*');
    // show() only previews the file. Capture is expensive and irreversible in Figma, so it waits for
    // the button — that is the user's chance to notice they picked the wrong file.
    function show(file, html) {
      const spec=extract(html), pageName=fileBaseName(file.name);
      selected={spec:{...spec,pageName},file,html,pageName,scene:null,graph:null,captureDone:false,directStarted:false,started:false};
      $('summary').style.display='block'; $('page-name-field').hidden=false; $('page-name').value=pageName;
      $('title').textContent=spec.title;
      $('stats').textContent=spec.headings.length+' headings · '+spec.labels.length+' labels';
      $('chips').innerHTML=[...spec.headings,...spec.labels].slice(0,10).map(v=>'<span class="chip">'+v.replace(/[&<>]/g,'')+'</span>').join('');
      $('download').disabled=false;
      $('status').textContent='Đã đọc '+file.name+'. Kiểm tra rồi bấm “'+$('download').textContent+'”.';
    }
    function deliver() {
      if (inFigma) return;
      download();
    }
    async function start() {
      if (!selected || selected.started) return;
      selected.started=true;
      $('download').disabled=true;
      const {file, html}=selected;
      const interactive=$('interactive').checked;

      if (!interactive) {
        $('status').textContent='Đang dựng layout '+file.name+'…';
        try {
          selected.scene=await captureSceneGraph(html);
          selected.captureDone=true;
          $('stats').textContent=selected.scene.nodes.length+' layers';
          if (inFigma) { postToFigma({type:'import',spec:selected.spec,pageName:selected.pageName,scene:selected.scene}); $('status').textContent='Đang tạo design editable trong Figma…'; }
          else { deliver(); }
        } catch (error) {
          $('stats').textContent='Không dựng được layout';
          $('status').textContent='Lỗi: '+error.message;
          $('download').disabled=false; selected.started=false;
        }
        return;
      }

      if (inFigma) { selected.directStarted=true; postToFigma({type:'import-start',spec:selected.spec,pageName:selected.pageName,totalHint:0}); }
      const onState = (state, graph) => {
        if (selected.file !== file) return;
        selected.graph=graph;
        selected.scene ||= state.scene;
        const layers=graph.states.reduce((total,item)=>total+item.scene.nodes.length,0);
        $('stats').textContent=graph.states.length+' state · '+layers+' layers';
        if (selected.directStarted) postToFigma({type:'import-state',state,transitions:graph.transitions});
      };
      // most paths dedupe into an existing state, so a states-only counter looks stuck mid-run
      const onProgress = ({attempted, planned, states}) => {
        if (selected.file !== file) return;
        $('status').textContent='Đang thử '+attempted+'/'+planned+' tương tác · '+states+' state'+(selected.directStarted?' — đang gửi sang Figma…':'…');
      };
      try {
        const graph=await captureStateGraph(html,{onProgress},onState);
        if (selected.file !== file) return;
        selected.graph=graph; selected.scene ||= graph.states[0]?.scene; selected.captureDone=true;
        $('status').textContent='Đã khám phá '+graph.states.length+' state từ '+file.name;
        if (selected.directStarted) postToFigma({type:'import-finish',graph});
        else deliver();
      } catch (error) {
        if (selected.file !== file) return;
        $('status').textContent='Không khám phá được state ('+error.message+'); dùng layout cơ bản.';
        if (selected.directStarted) postToFigma({type:'import-error',message:error.message});
        try {
          selected.graph=null; selected.scene=await captureSceneGraph(html); selected.captureDone=true;
          if (!inFigma) deliver();
        }
        catch (fallbackError) { $('stats').textContent='Không dựng được layout'; $('status').textContent='Lỗi: '+fallbackError.message; $('download').disabled=false; selected.started=false; }
      }
    }
    $('state-limit').textContent='(sâu '+explorationLimits.maxDepth+' cấp)';
    $('file').addEventListener('change',async e=>{const file=e.target.files[0];if(file)show(file,await file.text());});
    $('page-name').addEventListener('input', e=>{if(!selected)return;selected.pageName=e.target.value.trim()||fileBaseName(selected.file.name);selected.spec.pageName=selected.pageName;});
    $('download').addEventListener('click', start);
    if (inFigma) {
      // the plugin is already installed here, and `hidden` alone loses to the button's display rule
      document.querySelector('[data-install]').style.display = 'none';
      $('download').textContent = 'Tạo design trong Figma';
      $('download').classList.remove('fallback');
      $('download').classList.add('install');
      $('note').textContent = 'Chọn HTML, kiểm tra tên page, rồi bấm nút — plugin sẽ khám phá state và dựng design trong một lượt.';
      window.onmessage = event => {
        const message = event.data.pluginMessage;
        if (!message) return;
        $('status').textContent = message.type === 'progress'
          ? `Đang dựng Figma: ${message.current}/${message.total} layers…`
          : message.type === 'state-progress'
            ? `Đang tạo page state ${message.current}/${message.total}`
          : message.type === 'imported'
            ? `Đã tạo page “${message.pageName || message.title}” trong Figma.`
            : message.type === 'import-error'
              ? `Một state không tạo được: ${message.message}`
            : `Lỗi: ${message.message}`;
      };
    }
    $('drop').addEventListener('dragover',e=>{e.preventDefault();$('drop').classList.add('drag');});
    $('drop').addEventListener('dragleave',()=> $('drop').classList.remove('drag'));
    $('drop').addEventListener('drop',async e=>{e.preventDefault();$('drop').classList.remove('drag');const file=e.dataTransfer.files[0];if(file&&/\\.html?$/i.test(file.name))await show(file,await file.text());});
  </script>
</body>
</html>
